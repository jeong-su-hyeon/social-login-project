spring.application.name=social-login-project

# swagger ui
springdoc.packagesToScan=com.sociallogin.social_login_project.Controller

# 디버깅 코드 관리
logging.level.root=info

# ------ < 데이터베이스 관련 > ------
# [1] DB 접속 JDBC 드라이버 (현재 DB 설정은 MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# [2] DB 접속 URL 설정
# MySQL의 sociallogin_db 사용
# 시간대 설정 : UTC로 지정
# SSL 사용 여부 : 사용 안 함 (로컬 환경에서 성능 저하 방지)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/sociallogin_db?serverTimezone=UTC&useSSL=false

# [3] DB 사용자 이름
spring.datasource.username=jeongsuhyeon

# [4] DB 패스워드
spring.datasource.password=0625

# [5] JPA 설정 (DDL 자동 생성)
spring.jpa.hibernate.ddl-auto=update
#none : 아무것도 하지 않음 (DDL 작업 안 함)
#create : 매번 새로운 테이블 생성 (기존 데이터 삭제)
#creat-drop : 시작 시 생성, 종료 시 삭제
#update : 변경 내용만 반영/업데이트 (기존 데이터 보존)
#validate : 엔티티와 DB 검증, 변경 X

# [6] 실행 중 SQL 쿼리를 콘솔에 출력
spring.jpa.show-sql=true

# ------ < 구글 OAuth2 관련 > ------
# 구글 API에 등록한 클라이언트 정보가 들어감
# [7] 구글 OAuth2 클라이언트 ID (구글 클라우드 콘솔에서 발급 받은 값)
spring.security.oauth2.client.registration.google.client-id=

# [8] 구글 OAuth2 클라이언트 시크릿 키 (외부에 노출 x)
spring.security.oauth2.client.registration.google.client-secret=

# [9] 구글 OAuth2 인증 시 요청할 권한 범위 (사용자 프로필, 이메일)
spring.security.oauth2.client.registration.google.scope=profile, email

# ------ < 네이버 OAuth2 관련 > ------
# [10] 네이버 OAuth 클라이언트 ID (Naver Developers에서 발급)
spring.security.oauth2.client.registration.naver.client-id=

# [11] 네이버 OAuth 클라이언트 시크릿 키 (외부에 노출 x)
spring.security.oauth2.client.registration.naver.client-secret=

# [12] OAuth 인증 후 리다이렉트 URI (spring이 자동으로 값을 치환)
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/{action}/oauth2/code/{registrationId}

# [13] OAuth 인증 방식 (권한 코드 방식 사용)
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code

# [14] 네이버로부터 요청할 사용자 정보 범위
spring.security.oauth2.client.registration.naver.scope=name,email,profile_image

# [15] OAuth 로그인 버튼 등에 표시될 이름 (선택적인 UI 정보)
spring.security.oauth2.client.registration.naver.client-name=Naver

# [16] 네이버 인증 요청 URL (인가 코드 요청)
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize

# [17] 네이버 액세스 토큰 요청 URL
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token

# [18] 네이버 사용자 정보 조회 API URL
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me

# [19] 사용자 정보에서 이름으로 사용할 필드 (response 내부 객체 사용)
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ------ < 카카오 OAuth2 관련 > ------
# [20] Kakao에서 발급받은 RestAPI 키 (Client ID)
spring.security.oauth2.client.registration.kakao.client-id=

# [21] Kakao에서 발급받은 클라이언트 시크릿 (보안 주의)
spring.security.oauth2.client.registration.kakao.client-secret=

# [22] 인증 후 리다이렉트될 URI
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao

# [23] Kakao는 POST 방식으로 client secret 전송을 요구함
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

# [24] 권한 부여 방식은 authorization_code (OAuth2 표준)
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code

# [25] 요청할 사용자 정보 범위 (닉네임, 프로필 사진, 이메일)
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image,account_email

# [26] 로그인 버튼 또는 표시용 이름
spring.security.oauth2.client.registration.kakao.client-name=Kakao

# [27] 사용자 인증 요청 URI (카카오 로그인 페이지)
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize

# [28] 액세스 토큰 요청 URI
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token

# [29] 사용자 정보 조회 URI (액세스 토큰을 이용해 사용자 데이터를 가져옴)
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# [30] 응답에서 사용자 식별자로 사용할 필드명 (사용자 고유 ID로 사용할 JSON 필드명)
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# ------ < 깃허브 OAuth2 관련 > ------
# [31] 깃허브에서 발급받은 클라이언트 ID
spring.security.oauth2.client.registration.github.client-id=

# [32] 깃허브에서 발급받은 클라이언트 시크릿 (보안 유의)
spring.security.oauth2.client.registration.github.client-secret=

# [33] OAuth 로그인 완료 후 리다이렉트될 URL
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github

# [34] 로그인 시 요청할 깃허브 권한 범위 (기본 프로필, 이메일)
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# [35] 로그인 버튼에 표시될 이름
spring.security.oauth2.client.registration.github.client-name=Github

# [36] 깃허브 인증 요청 URI (깃허브 로그인 페이지)
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize

# [37] 액세스 토큰 요청 URI
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token

# [38] 사용자 정보 요청 URI
spring.security.oauth2.client.provider.github.user-info=https://api.github.com/user