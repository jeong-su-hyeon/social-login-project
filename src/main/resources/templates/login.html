<!-- 로그인 창 -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>     <!-- 탭 제목 -->

    <!-- Materialize CSS 프레임워크 링크 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Material JavaScript 라이브러리 (버튼 효과 등 상호작용 용도) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f9; /* 옅은 회색 배경색 */
            font-family: 'Roboto', sans-serif; /* 구글 폰트 추가 */
        }
    </style>

    <style>
        .container {
            width: 450px; /* 컨테이너 너비를 약간 줄여서 좁고 긴 느낌으로 */
            padding: 40px; /* 내부 여백을 더 넓게 */
            border-radius: 12px; /* 모서리를 부드럽게 */
            background-color: #ffffff; /* 흰색 배경 */
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1); /* 더 부드럽고 넓은 그림자 */
        }
    </style>

    <style>
        /* 입력 필드에 부드러운 전환 효과 추가 */
        .input-field input[type=text],
        .input-field input[type=password] {
            border-bottom: 2px solid #e0e0e0 !important;
            box-shadow: none !important;
        }
        .input-field input[type=text]:focus,
        .input-field input[type=password]:focus {
            border-bottom: 2px solid #2196f3 !important; /* 포커스 시 파란색으로 */
        }

        /* 버튼에 부드러운 전환 효과 추가 */
        .btn {
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #1e88e5 !important; /* 호버 시 약간 더 진한 파란색 */
        }

        /* 오류 메시지 스타일 */
        .card-panel.red {
            border-radius: 8px; /* 메시지 박스 모서리 둥글게 */
            box-shadow: none;
            padding: 12px;
        }
    </style>
</head>

<body>

<!-- [큰 컨테이너] 페이지 가운데 정렬 -->
<div class="container card z-depth-3">
    <!-- 큰 제목 -->
    <h4 class="center-align">Login</h4>

    <!-- [메시지 박스] 로그아웃 알림 -->
    <div th:if="${param.logout}" class="card-panel green lighten-4 green-text text-darken-4 center-align" style="margin-bottom: 20px; font-weight: 500;">
        <i class="material-icons left tiny">check_circle</i>로그아웃 되었습니다. 다시 로그인 해주세요.
    </div>

    <!-- [메시지 박스] 오류 알림 -->
    <div th:if="${param.error}" class="card-panel red lighten-4 red-text text-darken-4 center-align" style="margin-bottom: 20px; font-weight: 500;">
        <i class="material-icons left tiny">error_outline</i>아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <!-- 로그인 폼 시작 (POST 메서드) -->
    <form method="post" th:action="@{/login}" class="row">
        <!-- [영역 1] 사용자 이름 -->
        <div class="input-field col s12">
            <!-- [텍스트 박스] 사용자 이름 입력 (필수) -->
            <input type="text" name="username" id="email" required>
            <!-- [라벨] 입력 필드 라벨 -->
            <label for="email">Email</label>
        </div>

        <!-- [영역 2] 비밀번호 입력 -->
        <div class="input-field col s12">
            <!-- [텍스트 박스] 사용자 비밀번호 입력 (필수) -->
            <input type="password" name="password" id="password" required>
            <!-- [라벨] 입력 필드 라벨 -->
            <label for="password">Password</label>
        </div>

        <!-- [영역 3] 제출 -->
        <div class="center-align">
            <!-- [버튼] 파란색 로그인 버튼 -->
            <button type="submit" class="btn waves-effect waves-light blue">Login</button>
        </div>

        <!-- [영역 4] 소셜 로그인 영역 -->
        <div class="center-align">
            <p>Or login with</p>
            <!-- [버튼] 구글 로그인 링크 -->
            <!-- 별도의 컨트롤러 없이도 해당 url을 Spring Security가 처리해 줌 -->
            <a href="/oauth2/authorization/google" class="btn waves-effect waves-light red">Google</a>
            <!-- [버튼] 네이버 로그인 링크 -->
            <a href="/oauth2/authorization/naver" class="btn waves-effect waves-light green">Naver</a>
        </div>
    </form>

    <!-- 회원가입 링크 -->
    <p class="center-align">
        <a href="/users/register" class="blue-text">Don't have an account? Sign up</a>
    </p>
</div>

</body>
</html>
