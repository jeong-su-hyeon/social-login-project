<!-- 할 일을 CRUD 할 수 있는 전체 기능 흐름 페이지 (할 일 관리)-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Todo List</title>     <!-- 탭 제목 -->

    <!-- Materialize CSS 프레임워크 링크 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">

    <!-- [JS] 페이지 로드 후 실행할 JavaScript -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            M.updateTextFields();                                            // 입력 필드 라벨 위치 초기화
            const titleInput = document.getElementById("title");             // 제목 입력 필드 참조
            const descriptionInput = document.getElementById("description"); // 설명 입력 필드 참조
            M.textareaAutoResize(titleInput);       // 제목 필드 높이 자동 설정
            M.textareaAutoResize(descriptionInput); // 설명 필드 높이 자동 설정

        })
    </script>

    <!-- [CSS] 사용자 정의 스타일 -->
    <style>
        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }
        .todo-buttons {
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>

<!-- [큰 컨테이너] -->
<div class="container">
    <!-- 큰 제목 -->
    <h4 class="center-align">My TO-DOs</h4>

    <!-- [영역 1] 로그아웃 버튼 (오른쪽 정렬) -->
    <div class="right-align">
        <form method="post" th:action="@{/logout}"> <!-- POST 요청으로 로그아웃 -->
            <button type="submit" class="btn waves-effect waves-light red">Logout</button>
        </form>
    </div>

    <!-- [영역 2] 새 할일 추가 -->
    <form method="post" th:action="@{/todos/add}" class="row">
        <!-- 제목 입력 필드 (필수)-->
        <div class="input-field col s6">
            <input type="text" name="title" id="title" class="validate" required>
            <label for="title" class="active">Title</label>
        </div>

        <!-- 설명 입력 필드 -->
        <div class="input-field col s6">
            <input type="text" name="description" id="description" class="validate">
            <label for="description" class="active">Description</label>
        </div>

        <!-- [버튼] 제출 -->
        <div class="col s12 center-align">
            <button type="submit" class="btn waves-effect waves-light blue">Add TO-DO</button>
        </div>
    </form>

    <!-- [영역 3] 할 일 목록 존재할 경우 -->
    <div th:if="${todos != null and not #lists.isEmpty(todos)}">
        <ul class="collection">
            <li class="collection-item todo-item" th:each="todo : ${todos}">
                <div>
                    <strong th:text="${todo.title}"></strong>
                    <p th:text="@{todo.description}"></p>
                </div>
                <div class="todo-buttons">
                    <!-- [버튼] 수정 -->
                    <a th:href="@{'/todos/edit/' + ${todo.id}}" class="btn-small waves-effect waves-light orange">Edit</a>

                    <!-- [폼] 삭제 -->
                    <form method="post" th:action="@{'/todos/delete/' + ${todo.id}}">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn-small waves-effect waves-light red">Delete</button>
                    </form>
                </div>
            </li>
        </ul>
    </div>

    <!-- [영역 4] 할 일이 없을 경우 -->
    <p class="center-align" th:if="${todos == null or #lists.isEmpty(todos)}">
        No TO-DOs available. Add a new task above!
    </p>
</div>

</body>
</html>
